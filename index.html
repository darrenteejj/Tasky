<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tasky</title>
<meta name="theme-color" content="#1E1230">
<meta name="description" content="Tasky: a cosy sticky-note to-do board. Tick a note and it gets crumpled into the bin.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasky">
<meta property="og:title" content="Tasky">
<meta property="og:description" content="A cosy sticky-note to-do board. Tick a note and it gets crumpled into the bin.">
<meta property="og:image" content="/icon-512.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: one fixed 9:16 classroom scene (no scrolling). Overlays are placed in % of the scene: chalk count on the right blackboard, a cork panel of 8 sticky-note slots per board, the breathing mascot (sticky-note stack + pencil) layered above the cork, hotspots on his note stack and the bin. Single deliberate look. */
:root{
  color-scheme:dark;
  --room:#1E1230; --ink:#F4ECFF; --muted:#BCA9E6; --accent:#7A3FE4; --neon:#B98BFF;
  --cork:#9A6339; --note:#FFE45C; --note2:#FFD43B; --note-ink:#2D1B4E; --pen:#5B2BB8; --late:#C81E3A;
  --chalkbg:#272123; --chalk:#F3EFEA; --paper:#FFF8E8; --line:rgba(185,139,255,.28);
  --hand:"Patrick Hand","Comic Neue","Segoe Print",cursive;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--room);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:var(--room)}
.backdrop{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;object-position:50% 15%;filter:blur(22px) brightness(.6) saturate(1.2)}
.scene{position:relative;width:min(100vw,calc(100vh*9/16));width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;container-type:size;box-shadow:0 0 60px rgba(0,0,0,.6);overflow:hidden}
.scene>.bgimg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.abs{position:absolute}

/* chalk count on the right blackboard */
.chalkcount{left:75.03%;top:11.48%;width:15.09%;height:11.54%;background:var(--chalkbg);
  background-image:radial-gradient(120% 60% at 30% 40%,rgba(255,255,255,.05),transparent 60%),radial-gradient(80% 50% at 80% 80%,rgba(255,255,255,.035),transparent 70%);
  box-shadow:0 0 6px 4px var(--chalkbg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--hand);color:var(--chalk);
  text-shadow:0 0 1px rgba(255,255,255,.6),0 0 .4cqw rgba(255,255,255,.25);line-height:1;gap:.4cqw}
.chalkcount .num{font-size:8.6cqw}
.chalkcount .lbl{font-size:3.1cqw}
.chalkcount .sub{font-size:2.1cqw;opacity:.75;margin-top:.4cqw}

/* cork panel */
.cork{left:29.33%;top:24.40%;width:59.94%;height:42.11%;border-radius:.6cqw;overflow:hidden;background-color:var(--cork);
  background-image:radial-gradient(rgba(55,25,5,.45) .12cqw,transparent .2cqw),radial-gradient(rgba(255,214,160,.25) .1cqw,transparent .18cqw),radial-gradient(rgba(80,38,10,.35) .25cqw,transparent .32cqw);
  background-size:1.1cqw 1.1cqw,1.6cqw 1.6cqw,2.9cqw 2.9cqw;background-position:0 0,.6cqw .8cqw,1.3cqw .4cqw;
  box-shadow:inset 0 0 1.2cqw rgba(30,10,0,.7),inset 0 .5cqw 1cqw rgba(0,0,0,.35)}
.tabs{position:absolute;left:2%;right:2%;top:1.6%;height:7.4%;display:flex;gap:1.4cqw;overflow-x:auto;scrollbar-width:none;align-items:center;padding:0 .4cqw}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--paper);color:var(--note-ink);font-family:var(--hand);font-size:2.35cqw;line-height:1;padding:.9cqw 1.6cqw .8cqw;border-radius:.3cqw;box-shadow:0 .3cqw .6cqw rgba(0,0,0,.4);white-space:nowrap;display:flex;gap:.8cqw;align-items:center}
.tab:nth-child(odd){transform:rotate(-1.5deg)}.tab:nth-child(even){transform:rotate(1.2deg)}
.tab .n{background:var(--pen);color:#fff;border-radius:9cqw;padding:.15cqw .9cqw;font-family:var(--body);font-weight:800;font-size:1.7cqw}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 0 1.4cqw rgba(185,139,255,.9),0 .3cqw .6cqw rgba(0,0,0,.4)}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.3)}
.tab.add{background:rgba(255,248,232,.25);color:var(--paper);border:.25cqw dashed rgba(255,248,232,.7);box-shadow:none}
.notes{position:absolute;inset:0}

/* sticky notes */
.note{position:absolute;width:30%;height:25.5%;--r:0deg;transform:rotate(var(--r));background:linear-gradient(175deg,var(--note),var(--note2));color:var(--note-ink);
  border-radius:.2cqw .2cqw .4cqw 1.4cqw/.2cqw .2cqw .4cqw .6cqw;padding:2.3cqw 1.3cqw 1.1cqw;display:flex;flex-direction:column;gap:.5cqw;
  box-shadow:0 .1cqw .1cqw rgba(0,0,0,.15),0 1.2cqw 1.2cqw -.7cqw rgba(0,0,0,.6),inset 0 -1.4cqw 1.6cqw -1.4cqw rgba(160,110,0,.35)}
.note::before,.paper::before{content:"";position:absolute;top:-.9cqw;left:50%;width:2.2cqw;height:2.2cqw;margin-left:-1.1cqw;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 32%,#E7D6FF 0 12%,#9B6BFF 30%,#5B22C8 70%,#3A128A);box-shadow:0 .35cqw .4cqw rgba(0,0,0,.5)}
.note .top{display:flex;gap:.9cqw;align-items:flex-start;min-height:0;flex:1}
.box{border:0;background:transparent;padding:.8cqw;margin:-.8cqw;flex:none}
.box span{display:grid;place-items:center;width:3.3cqw;height:3.3cqw;border:.38cqw solid var(--pen);border-radius:.7cqw;background:rgba(255,255,255,.35);transition:background .15s}
.box svg{width:2.4cqw;height:2.4cqw;stroke:#fff;stroke-width:3.8;fill:none;stroke-dasharray:26;stroke-dashoffset:26}
.note.checked .box span{background:var(--pen);animation:boxpop .35s cubic-bezier(.3,1.8,.5,1)}
.note.checked .box svg{stroke-dashoffset:0;transition:stroke-dashoffset .2s ease}
@keyframes boxpop{50%{transform:scale(1.35)}}
.txt{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;font-family:var(--hand);font-size:2.55cqw;line-height:1.08;color:var(--note-ink);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:anywhere;align-self:stretch}
.due{display:flex;align-items:center;gap:.5cqw;font-family:var(--hand);font-size:2.05cqw;color:var(--pen);white-space:nowrap;overflow:hidden}
.due svg{width:2cqw;height:2cqw;flex:none}
.due.late{color:var(--late)}
.note.slap{animation:slap .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes slap{from{scale:1.4;opacity:0}}
.note.ball{background:radial-gradient(circle at 34% 30%,#FFF6B0 0 10%,#FFE04A 38%,#E8B71F 72%,#B98A10);border-radius:46% 52% 48% 50%}
.note.ball::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.6;
  background:linear-gradient(35deg,transparent 46%,rgba(140,95,0,.55) 48%,transparent 51%),linear-gradient(-60deg,transparent 40%,rgba(140,95,0,.5) 42%,transparent 45%),linear-gradient(100deg,transparent 58%,rgba(255,255,220,.7) 60%,transparent 63%),linear-gradient(10deg,transparent 30%,rgba(140,95,0,.4) 32%,transparent 35%)}
.note.ball>*,.note.ball::before{opacity:0;transition:opacity .15s}
.paper{position:absolute;left:30%;top:30%;width:44%;background:var(--paper);color:var(--note-ink);font-family:var(--hand);font-size:3.2cqw;text-align:center;padding:2.4cqw 1.6cqw;transform:rotate(2deg);box-shadow:0 1.2cqw 1.6cqw -.6cqw rgba(0,0,0,.55)}
.paper small{display:block;font-size:2.3cqw;opacity:.7;margin-top:.6cqw}

/* pager (right of the mascot's head) */
.pager[hidden]{display:none}
.pager{position:absolute;left:63%;top:90.4%;width:35%;height:9%;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:1.2cqw;z-index:3}
.pager .pg{order:1;background:var(--paper);color:var(--note-ink);font-family:var(--hand);font-size:2.2cqw;padding:.4cqw 1.2cqw;border-radius:.3cqw;transform:rotate(-2deg);box-shadow:0 .3cqw .5cqw rgba(0,0,0,.4);white-space:nowrap}
.pager .arrows{display:contents}
#prev{order:0}#next{order:2}
.pager button{border:0;width:4.2cqw;height:4.2cqw;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 .4cqw .8cqw rgba(0,0,0,.45);padding:0}
.pager button:disabled{opacity:.35}
.pager svg{width:2.6cqw;height:2.6cqw}

.memo{left:87.6%;top:56.6%;width:8.6%;height:10.4%;background:linear-gradient(170deg,#EFE4FF,#D9C5FF);color:var(--note-ink);font-family:var(--hand);font-size:2.05cqw;line-height:1.05;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.6cqw .4cqw .6cqw;transform:rotate(4deg);box-shadow:0 1cqw 1.2cqw -.5cqw rgba(0,0,0,.6);pointer-events:none}
.memo::before{content:"";position:absolute;top:-.8cqw;left:50%;width:1.9cqw;height:1.9cqw;margin-left:-.95cqw;border-radius:50%;background:radial-gradient(circle at 35% 32%,#E7D6FF 0 12%,#9B6BFF 30%,#5B22C8 70%,#3A128A);box-shadow:0 .3cqw .4cqw rgba(0,0,0,.5)}
.memo b{font-size:3.2cqw;font-weight:400;margin-top:.4cqw}
/* mascot layer + hotspots */
.boywrap{left:8.502%;top:49.043%;width:51.541%;height:26.555%;transform-origin:37% 100%;animation:sway 7s ease-in-out infinite}
.boy{position:absolute;inset:0;transform-origin:37% 100%;animation:breathe 3.4s ease-in-out infinite}
.boy img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}45%{transform:scale(1.006,1.017)}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-.7deg)}70%{transform:rotate(.6deg)}}
.boywrap.cheer .boy{animation:cheer .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes cheer{30%{transform:scale(1.04,.95) rotate(-1.5deg)}60%{transform:scale(.98,1.05) rotate(1deg)}}
.face{position:absolute;left:10.3%;top:6.8%;width:41.2%;height:42.8%;border:0;background:transparent;border-radius:50%}
.stack{position:absolute;left:12.4%;top:61.9%;width:20.6%;height:19.1%;border:0;background:transparent}
.plus{position:absolute;left:-3.4cqw;top:-2.6cqw;width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 .5cqw rgba(255,255,255,.85),0 .6cqw 1.2cqw rgba(0,0,0,.5);animation:pulse 2.2s ease-in-out infinite}
.plus svg{width:3cqw;height:3cqw}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.addlbl{position:absolute;left:-10cqw;top:-7.4cqw;background:var(--paper);color:var(--note-ink);font-family:var(--hand);font-size:2.3cqw;padding:.3cqw 1.1cqw;border-radius:.4cqw;white-space:nowrap;transform:rotate(-4deg);box-shadow:0 .3cqw .6cqw rgba(0,0,0,.4)}
.bin{left:45.16%;top:75.66%;width:19.66%;height:12.26%;border:0;background:transparent;transform-origin:50% 100%}
.bin .count{position:absolute;right:-1cqw;top:-1cqw;background:var(--accent);color:#fff;font-weight:800;font-size:2.3cqw;border-radius:9cqw;padding:.3cqw 1.2cqw;border:.4cqw solid #fff;font-variant-numeric:tabular-nums}
.binring{position:absolute;inset:0;border-radius:40%}
.bin.thunk .binring{animation:ring .6s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,228,92,.8)}100%{box-shadow:0 0 0 4cqw rgba(255,228,92,0)}}
.say{left:1.5%;top:44%;max-width:31%;background:var(--paper);color:var(--note-ink);font-family:var(--hand);font-size:2.9cqw;line-height:1.1;border-radius:2cqw 2cqw 2cqw .6cqw;padding:1.2cqw 1.8cqw;
  box-shadow:0 1cqw 2cqw rgba(0,0,0,.5);transform-origin:20% 100%;transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:5}
.say.hide{opacity:0;transform:scale(.6)}
.stars{left:33%;top:50.5%;width:6%;height:4%;pointer-events:none;font-size:3.4cqw;color:#FFE45C;text-shadow:0 0 1cqw rgba(255,228,92,.9);opacity:0}
.stars.go{animation:stars .9s ease-out}
@keyframes stars{0%{opacity:0;transform:translateY(1cqw) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-3cqw) scale(1.2)}}
.toast{left:50%;top:69.5%;width:47%;background:var(--paper);color:var(--note-ink);font-weight:800;font-size:2.7cqw;padding:1.4cqw 1.8cqw;border-radius:1.6cqw;display:flex;align-items:center;gap:1.4cqw;z-index:6;box-shadow:0 1cqw 2cqw rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes tin{from{transform:translateY(2cqw);opacity:0}}
.toast span{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:var(--pen);color:#fff;font-weight:800;border-radius:1cqw;padding:.8cqw 1.6cqw;flex:none}
.sync{left:0;right:0;bottom:.6%;text-align:center;font-size:1.9cqw;font-weight:700;color:rgba(255,240,220,.75);text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none}
.flyer{position:fixed;z-index:30;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:31;width:100%;height:100%}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,4,24,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#24143F;border:1px solid var(--line);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.3,1.3,.5,1);max-height:85%;overflow:auto;font-size:16px}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--muted);opacity:.4;align-self:center;flex:none}
.sheet h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.3rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.field input[type=text],.field select,.field input[type=date]{border:1px solid var(--line);background:#1A0F2E;border-radius:12px;padding:11px 12px;font-weight:700;font-size:1rem;width:100%}
.field input[type=date]{width:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 17px;font-weight:800}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 0 14px rgba(138,77,255,.5)}
.btn.ghost{background:rgba(185,139,255,.14);color:var(--ink)}
.btn.danger{background:transparent;color:#FF7A90;border:1.5px solid currentColor}
.btn.danger.armed{background:#E04A68;color:#fff;border-color:#E04A68}
.chip{border:0;background:rgba(185,139,255,.16);color:var(--neon);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
.spacer{flex:1}
.binlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.binlist li{display:flex;align-items:center;gap:10px;background:#1A0F2E;border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.binlist .bt{flex:1;min-width:0;font-family:var(--hand);font-size:1.15rem;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.binlist button{border:0;background:rgba(185,139,255,.16);color:var(--neon);border-radius:10px;padding:7px 11px;font-weight:800;font-size:.85rem;flex:none}
.muted{color:var(--muted);font-weight:700;margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="stage">

<script>
(function(){
const $=s=>document.querySelector(s);
$('#backdrop').src=$('#bgimg').src;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const LS='tasky.v1';
const still=matchMedia('(prefers-reduced-motion: reduce)');
const PER=8;
/* slot positions in % of the cork panel; row 3 skips the left slot (mascot's head) */
const SLOTS=[[3,10.5],[35,10],[67,10.8],[3.5,37.2],[35.5,37.6],[67,37],[35,64.3],[67.5,64.8]];

function defaults(){
  return {v:1,pages:[{id:'personal',name:'Personal'}],tasks:[]};
}
let state=null, cur='personal', pageNo=0, docRef=null, dirty=false, saveT=null, busy=0;
try{const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&s.pages) state=s; cur=localStorage.getItem(LS+'.page')||'personal'}catch(e){}

/* ---------- persistence ---------- */
function save(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!docRef) return;
  dirty=true; clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{await docRef.set({json:JSON.stringify(state),at:Date.now()}); $('#sync').textContent='Saved to your account'}
    catch(e){$('#sync').textContent='Saved on this device only'}
    dirty=false;
  },500);
}
(async()=>{
  try{
    const db=await window.claude?.use?.('db'); const user=await window.claude?.use?.('user');
    if(!db||!user){ if(!state){state=defaults();save()} $('#sync').textContent='Saved on this device'; render(); return }
    const id=await user.id(); if(!id) throw 0;
    docRef=db.collection('data/users/'+id).doc('tasky');
    const snap=await docRef.get();
    if(snap.exists){ try{state=JSON.parse(snap.data().json)}catch(e){} }
    else { if(!state) state=defaults(); save() }
    $('#sync').textContent='Synced to your account';
    render();
    docRef.onSnapshot(s=>{ if(dirty||busy||!s.exists) return; try{const n=JSON.parse(s.data().json); if(JSON.stringify(n)!==JSON.stringify(state)){state=n; try{localStorage.setItem(LS,s.data().json)}catch(e){} render()}}catch(e){} },()=>{});
  }catch(e){ if(!state){state=defaults()} $('#sync').textContent='Saved on this device'; render() }
})();
if(!state) state=defaults();

/* ---------- dates ---------- */
const DAY=86400000;
function today0(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dueInfo(s){
  const d=parse(s), diff=Math.round((d-today0())/DAY);
  const opts={day:'numeric',month:'short'}; if(d.getFullYear()!==new Date().getFullYear()) opts.year='2-digit';
  const label=d.toLocaleDateString('en-SG',opts);
  if(diff===0) return {cls:'',text:'Today'};
  if(diff===1) return {cls:'',text:'Tomorrow'};
  if(diff<0) return {cls:'late',text:label+' · late'};
  return {cls:'',text:label};
}
const CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function tilt(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))|0;return ((Math.abs(h)%61)/10-3).toFixed(1)}

/* ---------- render ---------- */
function pageName(id){return (state.pages.find(p=>p.id===id)||{}).name||'Personal'}
function openOf(page){return state.tasks.filter(t=>t.page===page&&!t.done).sort((a,b)=>{
  if(a.due&&b.due) return a.due<b.due?-1:a.due>b.due?1:a.created-b.created;
  if(a.due) return -1; if(b.due) return 1; return b.created-a.created;})}
function render(){
  if(!state.pages.find(p=>p.id===cur)) cur='personal';
  const tabs=$('#tabs'); tabs.innerHTML='';
  state.pages.forEach(p=>{
    const n=state.tasks.filter(t=>t.page===p.id&&!t.done).length;
    const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.setAttribute('aria-selected',p.id===cur);
    b.innerHTML=esc(p.name)+(n?'<span class="n">'+n+'</span>':'');
    b.onclick=()=>{ if(p.id===cur&&p.id!=='personal') return pageSheet(p); cur=p.id; pageNo=0; try{localStorage.setItem(LS+'.page',cur)}catch(e){} render(); slide(1)};
    tabs.appendChild(b);
  });
  const add=document.createElement('button'); add.className='tab add'; add.textContent='+ Board'; add.onclick=()=>pageSheet(); tabs.appendChild(add);
  const sel=tabs.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'nearest'});

  const all=state.tasks.filter(t=>!t.done).length;
  $('#num').textContent=all||'✓'; $('#lbl').textContent=all?(all===1?'task to go':'tasks to go'):'all done!';
  const boards=new Set(state.tasks.filter(t=>!t.done).map(t=>t.page)).size;
  $('#sub').textContent=all?('on '+boards+(boards===1?' board':' boards')):'';

  const open=openOf(cur), pages=Math.max(1,Math.ceil(open.length/PER));
  if(pageNo>pages-1) pageNo=pages-1;
  const box=$('#notes'); box.innerHTML='';
  const done=state.tasks.filter(t=>t.page===cur&&t.done).length;
  if(!open.length) box.innerHTML='<div class="paper">'+(done?'Board cleared!':'Nothing pinned yet')+'<small>'+(done?'Everything went in the bin.':'Tap the sticky notes in my hand.')+'</small></div>';
  open.slice(pageNo*PER,pageNo*PER+PER).forEach((t,i)=>box.appendChild(note(t,i)));
  $('#pager').hidden=pages<2; $('#pg').textContent='Board '+(pageNo+1)+'/'+pages;
  $('#prev').disabled=pageNo===0; $('#next').disabled=pageNo>=pages-1;
  const bc=$('#bincount'); bc.hidden=!done; bc.textContent=done;
}
function note(t,i){
  const el=document.createElement('div'); el.className='note'; el.dataset.id=t.id; el.style.setProperty('--r',tilt(t.id)+'deg');
  el.style.left=SLOTS[i][0]+'%'; el.style.top=SLOTS[i][1]+'%';
  let due=''; if(t.due){const d=dueInfo(t.due); due='<div class="due '+d.cls+'">'+CAL+esc(d.text)+'</div>'}
  el.innerHTML='<div class="top"><button class="box" aria-label="Tick off: '+esc(t.title)+'"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>'+
    '<button class="txt" aria-label="Edit task">'+esc(t.title)+'</button></div>'+due;
  el.querySelector('.box').onclick=()=>tick(t,el);
  el.querySelector('.txt').onclick=()=>taskSheet(t);
  return el;
}
function slide(dir){ if(still.matches) return; $('#notes').animate([{transform:'translateX('+(dir*35)+'%)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.3,1.2,.5,1)'}) }
function goPage(d){const n=Math.max(1,Math.ceil(openOf(cur).length/PER)); const p=Math.min(n-1,Math.max(0,pageNo+d)); if(p===pageNo) return; pageNo=p; render(); slide(d); slapSound()}
$('#prev').onclick=()=>goPage(-1); $('#next').onclick=()=>goPage(1);
let sx=null,sy=0;
$('#cork').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
$('#cork').addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4) goPage(dx<0?1:-1)});

/* ---------- mascot ---------- */
const YAY=['Into the bin!','Swish! Nice one!','One less thing!','Yay, done!','Great job!','Crumpled it!','Look at you go!','Score!'];
const IDLE=['You got this!','Tick a box to bin it.','Small steps, big progress!','I’m cheering for you!','Tap the bin to undo.','Tap my notes to add one.'];
let sayT;
function say(msg,stars){
  const s=$('#say'); s.textContent=msg; s.classList.remove('hide'); clearTimeout(sayT); sayT=setTimeout(()=>s.classList.add('hide'),2400);
  if(stars){const bw=$('#boywrap'); bw.classList.remove('cheer'); void bw.offsetWidth; bw.classList.add('cheer'); const st=$('#stars'); st.classList.remove('go'); void st.offsetWidth; st.classList.add('go')}
}
$('#face').onclick=()=>{say(IDLE[Math.floor(Math.random()*IDLE.length)],true); boop()};
setTimeout(()=>say('Hi there!',true),900);

/* ---------- tick → crumple → bin ---------- */
function finish(t){
  t.done=true; t.doneAt=Date.now(); save(); render();
  if(!state.tasks.some(x=>x.page===cur&&!x.done)){fanfare(); spawn(innerWidth/2,innerHeight*.35,100,11); say('Board cleared! Amazing!',true)}
  else say(YAY[Math.floor(Math.random()*YAY.length)],true);
  toast('Binned “'+t.title+'”',()=>{t.done=false; t.doneAt=null; save(); const i=openOf(cur).indexOf(t); pageNo=Math.floor(Math.max(i,0)/PER); render(); const el=document.querySelector('[data-id="'+t.id+'"]'); if(el) el.classList.add('slap')});
}
function tick(t,el){
  if(el.classList.contains('checked')) return;
  el.classList.add('checked'); tickSound(); try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
  if(still.matches){ setTimeout(()=>finish(t),250); return }
  busy++;
  setTimeout(()=>{
    const r=el.getBoundingClientRect(), a=parseFloat(tilt(t.id));
    const w=el.offsetWidth, h=el.offsetHeight;
    const fly=document.createElement('div'); fly.className='flyer';
    const cxp=r.left+r.width/2, cyp=r.top+r.height/2;
    fly.style.cssText='left:'+(cxp-w/2)+'px;top:'+(cyp-h/2)+'px;width:'+w+'px;height:'+h+'px';
    const spin=document.createElement('div'); spin.style.cssText='width:100%;height:100%';
    const c=el.cloneNode(true); c.style.left='0';c.style.top='0';c.style.width='100%';c.style.height='100%';
    /* the clone lives outside the scene, so give it the scene's cqw scale */
    const sw=$('#scene').offsetWidth;
    spin.appendChild(c); fly.appendChild(spin);
    const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:0;top:0;width:'+sw+'px;height:'+(sw*16/9)+'px;container-type:size;pointer-events:none;z-index:30';
    holder.appendChild(fly); document.body.appendChild(holder);
    el.style.visibility='hidden';
    crumpleSound();
    const ball=$('#scene').offsetWidth*.06/Math.max(w,h);
    c.animate([
      {transform:'rotate('+a+'deg) scale(1)'},
      {transform:'rotate('+(a-7)+'deg) scale(.9,.8)',offset:.25},
      {transform:'rotate('+(a+14)+'deg) scale(.6,.7)',offset:.5},
      {transform:'rotate('+(a-20)+'deg) scale('+(ball*1.4)+')',offset:.75},
      {transform:'rotate('+(a+40)+'deg) scale('+ball+')'}
    ],{duration:520,easing:'ease-in',fill:'forwards'});
    setTimeout(()=>c.classList.add('ball'),260);
    setTimeout(()=>{
      const s=$('#scene').getBoundingClientRect();
      const tx=s.left+s.width*.5494, ty=s.top+s.height*.7690;
      const dx=tx-cxp, dy=ty-cyp;
      const hgt=Math.max(s.height*.12,Math.min(s.height*.28,Math.abs(dx)*.6+s.height*.08));
      const kf=[]; for(let i=0;i<=14;i++){const p=i/14; kf.push({transform:'translate('+(dx*p)+'px,'+(dy*p-4*hgt*p*(1-p))+'px)'})}
      kf.push({transform:'translate('+dx+'px,'+(dy+s.height*.03)+'px)'});
      whoosh();
      fly.animate(kf,{duration:700,easing:'linear',fill:'forwards'});
      spin.animate([{transform:'rotate(0)'},{transform:'rotate(600deg)'}],{duration:700,easing:'linear',fill:'forwards'});
      const fade=fly.animate([{opacity:1},{opacity:1,offset:.9},{opacity:0}],{duration:740,fill:'forwards'});
      fade.onfinish=()=>{
        holder.remove(); busy--;
        const bin=$('#bin'); bin.classList.remove('thunk'); void bin.offsetWidth; bin.classList.add('thunk');
        bin.animate([{transform:'scale(1)'},{transform:'scale(1.06,.94) rotate(-3deg)',offset:.3},{transform:'scale(.97,1.03) rotate(2deg)',offset:.6},{transform:'scale(1)'}],{duration:450});
        thunk(); spawn(tx,ty,18,4);
        finish(t);
      };
    },520);
  },320);
}

/* ---------- sheets ---------- */
function openSheet(html,wire){
  const layer=$('#layer'); layer.innerHTML='<div class="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  const scrim=layer.firstChild; const close=()=>layer.innerHTML='';
  scrim.onclick=e=>{if(e.target===scrim) close()};
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  wire(scrim,close);
}
function armDelete(btn,fn,label){
  const orig=btn.textContent;
  btn.onclick=()=>{ if(btn.classList.contains('armed')) return fn();
    btn.classList.add('armed'); btn.textContent=label; setTimeout(()=>{btn.classList.remove('armed');btn.textContent=orig},3000) };
}
const DATEFIELD=(id,v)=>'<div class="field"><label for="'+id+'">Target date (optional)</label><div class="row"><input type="date" id="'+id+'" value="'+(v||'')+'"><button type="button" class="chip" data-q="0">Today</button><button type="button" class="chip" data-q="1">Tomorrow</button><button type="button" class="chip" data-q="7">Next week</button><button type="button" class="chip" data-q="x">No date</button></div></div>';
function wireDates(s,id){s.querySelectorAll('.chip[data-q]').forEach(b=>b.onclick=()=>{s.querySelector('#'+id).value=b.dataset.q==='x'?'':iso(new Date(today0().getTime()+(+b.dataset.q)*DAY))})}
function addSheet(){
  openSheet('<h3>New sticky note</h3><div class="field"><label for="nt">Task</label><input type="text" id="nt" maxlength="200" placeholder="What needs doing?"></div>'+DATEFIELD('nd')+
    '<div class="field"><label>Board</label><div class="muted">'+esc(pageName(cur))+'</div></div>'+
    '<div class="actions"><span class="spacer"></span><button class="btn ghost" id="nc">Cancel</button><button class="btn primary" id="ns">Stick it</button></div>',
  (s,close)=>{
    const inp=s.querySelector('#nt'); setTimeout(()=>inp.focus(),60); wireDates(s,'nd');
    s.querySelector('#nc').onclick=close;
    const go=()=>{const v=inp.value.trim(); if(!v) return inp.focus();
      const t={id:uid(),page:cur,title:v,due:s.querySelector('#nd').value||null,done:false,created:Date.now()};
      state.tasks.push(t); save(); close(); const i=openOf(cur).indexOf(t); pageNo=Math.floor(i/PER); render();
      const el=document.querySelector('[data-id="'+t.id+'"]'); if(el) el.classList.add('slap'); slapSound(); say('Pinned it!',true)};
    s.querySelector('#ns').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter') go()};
  });
}
$('#stack').onclick=()=>addSheet();
function taskSheet(t){
  const opts=state.pages.map(p=>'<option value="'+p.id+'"'+(p.id===t.page?' selected':'')+'>'+esc(p.name)+'</option>').join('');
  openSheet('<h3>Edit note</h3>'+
    '<div class="field"><label for="et">Task</label><input type="text" id="et" maxlength="200" value="'+esc(t.title)+'"></div>'+DATEFIELD('ed',t.due)+
    '<div class="field"><label for="ep">Board</label><select id="ep">'+opts+'</select></div>'+
    '<div class="actions"><button class="btn danger" id="edel">Delete</button><span class="spacer"></span><button class="btn ghost" id="ecancel">Cancel</button><button class="btn primary" id="esave">Save</button></div>',
  (s,close)=>{
    wireDates(s,'ed');
    s.querySelector('#ecancel').onclick=close;
    s.querySelector('#esave').onclick=()=>{const v=s.querySelector('#et').value.trim(); if(v) t.title=v; t.due=s.querySelector('#ed').value||null; t.page=s.querySelector('#ep').value; save(); close(); render()};
    armDelete(s.querySelector('#edel'),()=>{const i=state.tasks.indexOf(t); state.tasks.splice(i,1); save(); close(); render(); toast('Note deleted',()=>{state.tasks.splice(i,0,t);save();render()})},'Tap to confirm');
  });
}
function binSheet(){
  const done=state.tasks.filter(t=>t.page===cur&&t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  openSheet('<h3>In the bin</h3>'+(done.length?'<ul class="binlist">'+done.map(t=>'<li><span class="bt">'+esc(t.title)+'</span><button data-id="'+t.id+'">Take out</button></li>').join('')+'</ul>':'<p class="muted">The bin is empty. Tick a note to throw it in.</p>')+
    '<div class="actions">'+(done.length?'<button class="btn danger" id="empty">Empty bin</button>':'')+'<span class="spacer"></span><button class="btn ghost" id="bclose">Close</button></div>',
  (s,close)=>{
    s.querySelector('#bclose').onclick=close;
    s.querySelectorAll('.binlist button').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id===b.dataset.id); if(!t) return;
      t.done=false; t.doneAt=null; save(); const i=openOf(cur).indexOf(t); pageNo=Math.floor(i/PER); render();
      const el=document.querySelector('[data-id="'+t.id+'"]'); if(el) el.classList.add('slap');
      b.closest('li').remove(); if(!s.querySelector('.binlist li')) close(); say('Back on the board!',true)});
    const e=s.querySelector('#empty'); if(e) armDelete(e,()=>{state.tasks=state.tasks.filter(t=>!(t.page===cur&&t.done)); save(); close(); render(); say('Bin emptied!',true)},'Tap again to empty');
  });
}
$('#bin').onclick=()=>binSheet();
function pageSheet(p){
  const editing=!!p;
  openSheet('<h3>'+(editing?'Board settings':'New board')+'</h3>'+
    '<div class="field"><label for="pn">Board name</label><input type="text" id="pn" maxlength="40" placeholder="e.g. Turf City MRT" value="'+(editing?esc(p.name):'')+'"></div>'+
    '<div class="actions">'+(editing?'<button class="btn danger" id="pdel">Delete</button>':'')+'<span class="spacer"></span><button class="btn ghost" id="pcancel">Cancel</button><button class="btn primary" id="psave">'+(editing?'Save':'Create')+'</button></div>',
  (s,close)=>{
    const inp=s.querySelector('#pn'); setTimeout(()=>inp.focus(),60);
    s.querySelector('#pcancel').onclick=close;
    const go=()=>{const v=inp.value.trim(); if(!v) return inp.focus();
      if(editing) p.name=v; else {const np={id:uid(),name:v}; state.pages.push(np); cur=np.id; pageNo=0}
      save(); close(); render(); if(!editing) say('New board! Let’s go!',true)};
    s.querySelector('#psave').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter') go()};
    if(editing){const n=state.tasks.filter(t=>t.page===p.id).length;
      armDelete(s.querySelector('#pdel'),()=>{state.pages=state.pages.filter(x=>x.id!==p.id); state.tasks=state.tasks.filter(t=>t.page!==p.id); cur='personal'; pageNo=0; save(); close(); render()}, n?'Delete with '+n+' note'+(n>1?'s':''):'Tap to confirm')}
  });
}
let toastT;
function toast(msg,undo){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const d=document.createElement('div'); d.className='abs toast'; d.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button>Undo</button>':'');
  if(undo) d.querySelector('button').onclick=()=>{undo();d.remove()};
  $('#scene').appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),4000);
}

/* ---------- sound ---------- */
let ac=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume()}catch(e){ac=null} return ac}
function tone(f,start,dur,vol,type,slide){
  const a=ctx(); if(!a) return; const t=a.currentTime+start;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur*.7);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(start,dur,vol,freq,q,crackle){
  const a=ctx(); if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ d[i]=crackle?(Math.random()<.06?(Math.random()*2-1):(Math.random()*2-1)*.12):(Math.random()*2-1) }
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(), t=a.currentTime+start; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
function tickSound(){ tone(1046.5,0,.12,.14,'triangle'); tone(1568,.05,.22,.1,'sine') }
function crumpleSound(){ for(let i=0;i<5;i++) noise(i*.07,.12,.5,2200+Math.random()*1800,.9,true) }
function whoosh(){ noise(0,.5,.22,700,.7,false) }
function thunk(){ tone(150,0,.18,.35,'sine',70); noise(0,.08,.25,500,1,false); tone(1318,.08,.25,.12,'triangle'); tone(1976,.14,.35,.1,'sine') }
function slapSound(){ noise(0,.06,.35,1200,.8,false); tone(220,0,.08,.15,'sine',140) }
function boop(){ tone(500,0,.18,.12,'sine',900) }
function fanfare(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.3+i*.09,.4,.13,'triangle')) }

/* ---------- confetti ---------- */
const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], raf=null;
const COLORS=['#9B6BFF','#C7A2FF','#FFD43B','#FFE45C','#FF8EC8'];
function resize(){const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',resize); resize();
function spawn(x,y,n,spd){ if(still.matches) return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, s=spd*(.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.6,r:2.5+Math.random()*3.5,c:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sq:Math.random()<.5})}
  if(!raf) raf=requestAnimationFrame(step)}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.98;p.rot+=p.vr;p.life-=.018;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sq) cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); else {cx.beginPath();cx.arc(0,0,p.r*.7,0,7);cx.fill()}
    cx.restore()});
  raf=parts.length?requestAnimationFrame(step):null; if(!raf) cx.clearRect(0,0,innerWidth,innerHeight);
}

render();
})();
</script>
